<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Clase grabada</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:#0b0d14;color:#e6e9f2;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
main{max-width:980px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:1.05rem;margin:6px 0 2px}.sub{color:#9aa6b8;font-size:.85rem;margin:0 0 12px}
#caja{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:16/9;width:100%}
#caja video{width:100%;height:100%;display:block;background:#000}
#wm{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
#wm span{position:absolute;white-space:nowrap;font-size:13px;font-weight:600;color:rgba(255,255,255,.34);text-shadow:0 0 3px rgba(0,0,0,.6);transform:rotate(-18deg);transition:left 1.2s,top 1.2s}
#tapa{position:absolute;inset:0;z-index:9;background:#000;color:#e6e9f2;display:none;place-items:center;text-align:center;padding:20px;font-size:.95rem}
#tapa.on{display:grid}#tapa button{margin-top:12px;padding:9px 18px;border:0;border-radius:999px;background:#6d28d9;color:#fff;font:inherit;font-weight:600;cursor:pointer}
#barra{height:8px;background:#1b2030;border-radius:999px;margin:14px 0 6px;overflow:hidden}#barra i{display:block;height:100%;width:0;background:#6d28d9;transition:width .6s}
#info{color:#9aa6b8;font-size:.85rem}#info b{color:#e6e9f2}
.aviso{margin-top:16px;padding:10px 14px;border-radius:12px;background:#151a28;color:#9aa6b8;font-size:.8rem;line-height:1.45}
#fs{position:absolute;right:10px;bottom:56px;z-index:8;border:0;border-radius:8px;background:rgba(0,0,0,.55);color:#fff;padding:6px 9px;cursor:pointer;font-size:14px;display:none}
.err{padding:30px 10px;text-align:center;color:#f0b4b4}
@media print{body *{display:none!important}body::after{content:"No se puede imprimir esta página.";display:block;color:#000}}
</style>
</head>
<body>
<main>
  <h1 id="tit">Clase grabada</h1><p class="sub" id="sub">Cargando…</p>
  <div id="caja">
    <video id="v" playsinline controlsList="nodownload noremoteplayback nofullscreen" disablePictureInPicture disableRemotePlayback preload="metadata" oncontextmenu="return false"></video>
    <div id="wm" aria-hidden="true"></div>
    <button id="fs" type="button" aria-label="Pantalla completa">⛶</button>
    <div id="tapa"><div><div id="tapaTxt">Vuelve a esta pestaña para continuar.</div><button id="tapaBtn" type="button">Continuar</button></div></div>
  </div>
  <div id="barra"><i></i></div>
  <div id="info"></div>
  <div class="aviso">Este enlace es personal y vence. Tu nombre aparece sobre el video y la clase se puede ver desde un solo lugar a la vez. Para que cuente como reposición mírala completa, sin saltar partes (se registra el tiempo real que la ves).</div>
</main>
<script src="/js/ver.js"></script>
</body>
</html>
