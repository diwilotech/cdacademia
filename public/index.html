<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ingresar · Control de Academia</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--marca:#7a2e5c;--marca-suave:#f6ebf1;--tinta:#2a1f26;--fondo:#faf8f9;--borde:#eadfe5}
  body{background:var(--fondo);color:var(--tinta);font-family:Manrope,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:16px}
  .caja{width:100%;max-width:380px;background:#fff;border:1px solid var(--borde);border-radius:1rem;padding:2rem}
  h1{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:1.7rem}
  .logo{width:46px;height:46px;border-radius:12px;background:var(--marca);color:#fff;display:grid;place-items:center;font-size:1.3rem}
  .btn-marca{background:var(--marca);color:#fff;border-color:var(--marca)}
  .btn-marca:hover{filter:brightness(1.1);color:#fff}
  .form-control:focus{border-color:var(--marca);box-shadow:0 0 0 .2rem rgba(122,46,92,.15)}
</style>
</head>
<body>
<main class="caja">
  <div class="logo mb-3"><i class="bi bi-mortarboard"></i></div>
  <h1 class="mb-1">Control de Academia</h1>
  <p class="text-muted small mb-4">Ingresa con tu correo y tu PIN.</p>
  <form id="f" novalidate>
    <label class="form-label small" for="email">Correo</label>
    <input class="form-control mb-3" id="email" type="email" autocomplete="username" required autofocus>
    <label class="form-label small" for="pin">PIN</label>
    <input class="form-control mb-3" id="pin" type="password" autocomplete="current-password" required>
    <div class="alert alert-danger py-2 small d-none" id="err" role="alert"></div>
    <button class="btn btn-marca w-100" id="ok">Ingresar</button>
  </form>
</main>
<script>
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('err'), ok = document.getElementById('ok');
  err.classList.add('d-none'); ok.disabled = true;
  try {
    const r = await fetch('/api/login', {method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({email: email.value, pin: pin.value})});
    const d = await r.json().catch(() => ({}));
    if (r.ok) { location.href = '/admin'; return; }
    err.textContent = d.error || 'No se pudo ingresar'; err.classList.remove('d-none');
  } catch { err.textContent = 'Sin conexión. Intenta de nuevo.'; err.classList.remove('d-none'); }
  ok.disabled = false;
});
</script>
</body>
</html>
